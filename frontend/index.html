<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <title>jobFix</title>
    <meta name="description" content="Analyze your CV, match it to jobs, tailor it without inventing anything, and export it for applicant tracking systems." />
    <script>
      // Apply the stored theme and language before the first paint, so the
      // page never flashes the other theme or flips direction after loading.
      // Without a stored choice the stylesheet follows the system theme, and
      // the language follows the browser's first language.
      (function () {
        var root = document.documentElement;
        try {
          var t = localStorage.getItem('resume-analyzer-theme');
          if (t === 'light' || t === 'dark') root.dataset.theme = t;
        } catch (e) {}
        var l = null;
        try {
          l = localStorage.getItem('resume-analyzer-lang');
        } catch (e) {}
        if (l !== 'en' && l !== 'ar') {
          var first = (navigator.languages && navigator.languages[0]) || navigator.language || '';
          l = first.toLowerCase().indexOf('ar') === 0 ? 'ar' : 'en';
        }
        root.lang = l;
        root.dir = l === 'ar' ? 'rtl' : 'ltr';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
