<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <title>jobFix</title>
    <meta name="description" content="Analyze your CV, match it to jobs, tailor it without inventing anything, and export it for applicant tracking systems." />
    <script>
      // Apply the stored theme and language before the first paint, so the
      // page never flashes the other theme or flips direction after loading.
      // Without a stored choice the stylesheet follows the system theme, and
      // the language follows the browser's first language.
      //
      // Both settings were stored under resume-analyzer-* before the app was
      // called jobFix. This script runs before anything else on the page, so
      // it is where the old names are carried over: read the new key, fall
      // back to the old one, and move it across. A returning reader keeps the
      // theme and language they chose.
      (function () {
        var root = document.documentElement;
        function read(key, was) {
          try {
            var v = localStorage.getItem(key);
            if (v === null) {
              v = localStorage.getItem(was);
              if (v !== null) {
                localStorage.setItem(key, v);
                localStorage.removeItem(was);
              }
            }
            return v;
          } catch (e) {
            return null; // private windows and blocked storage
          }
        }
        var t = read('jobfix-theme', 'resume-analyzer-theme');
        if (t === 'light' || t === 'dark') root.dataset.theme = t;
        var l = read('jobfix-lang', 'resume-analyzer-lang');
        if (l !== 'en' && l !== 'ar') {
          var first = (navigator.languages && navigator.languages[0]) || navigator.language || '';
          l = first.toLowerCase().indexOf('ar') === 0 ? 'ar' : 'en';
        }
        root.lang = l;
        root.dir = l === 'ar' ? 'rtl' : 'ltr';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
