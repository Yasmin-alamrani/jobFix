<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Resume Analyzer</title>
    <meta name="description" content="Analyze your CV, match it to jobs, tailor it without inventing anything, and export it for applicant tracking systems." />
    <script>
      // Apply a stored theme before the first paint, so there is no flash of
      // the other one. Without a stored choice the stylesheet follows the system.
      (function () {
        try {
          var t = localStorage.getItem('resume-analyzer-theme');
          if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
